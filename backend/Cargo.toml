[package]
name = "database-studio"
version = "0.1.0"
description = "Database Studio — personal SQL/NoSQL desktop client"
edition = "2021"
rust-version = "1.77"

[lib]
name = "database_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"

# SQL drivers (Phase 1: PG / MySQL / MariaDB / MSSQL / SQLite)
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "mysql",
  "chrono",
  "rust_decimal",
  "uuid",
  "json",
  "bigdecimal",
] }
tiberius = { version = "0.12", default-features = false, features = [
  "tds73",
  "rustls",
  "chrono",
  "rust_decimal",
  "winauth",
] }
rusqlite = { version = "0.32", features = ["bundled", "backup", "column_decltype"] }

# SSH tunnel
russh = { version = "0.54", default-features = false, features = ["ring", "flate2", "rsa"] }

# Security: password encryption + OS keychain
aes-gcm = "0.10"
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
base64 = "0.22"

# Misc
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
bigdecimal = "0.4"
regex = "1"
dirs = "5"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
