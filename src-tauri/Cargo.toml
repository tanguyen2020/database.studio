[package]
name = "database-studio"
version = "0.1.0"
description = "Database Studio — personal SQL/NoSQL desktop client"
edition = "2021"
rust-version = "1.77"

[lib]
name = "database_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"

# SQL drivers (Phase 1: PG / MySQL / MariaDB / MSSQL / SQLite)
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "mysql",
  "chrono",
  "rust_decimal",
  "uuid",
  "json",
  "bigdecimal",
] }
tiberius = { version = "0.12", default-features = false, features = [
  "tds73",
  "rustls",
  "chrono",
  "rust_decimal",
  "winauth",
] }
rusqlite = { version = "0.32", features = ["bundled", "backup", "column_decltype"] }

# SSH tunnel
russh = { version = "0.54", default-features = false, features = ["ring", "flate2", "rsa"] }

# Security: password encryption + OS keychain
# NOTE: keyring is declared per-target below (`[target.…dependencies]`) so each
# OS compiles its NATIVE backend. Without a native backend keyring 3.x silently
# falls back to an in-memory MOCK store → the master key is never persisted →
# every launch derives a fresh key → AES-GCM decrypt of stored passwords fails
# with `aead::Error`. (Was Windows-only before, which broke macOS/Linux.)
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

# SQL lint tầng 1 (parse-only, không chạy DB) — QUERY_EDITOR_ERROR_HANDLING_ADDENDUM §1.1
sqlparser = "0.53"

# MSSQL SHOWPLAN_XML parse (read-only, pure-Rust) — Query Plan T16
roxmltree = "0.20"

# ClickHouse qua HTTP 8123 + FORMAT JSON (addendum CH §9 — HTTP; dùng reqwest
# thay crate `clickhouse` vì result set động không hợp API typed-row của crate đó)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Redis (Phase 3) — async tokio + rustls TLS (rediss://). CA tùy chọn qua TlsCertificates.
redis = { version = "0.27", default-features = false, features = [
  "tokio-comp",
  "tokio-rustls-comp",
  "tls-rustls-webpki-roots",
  "keep-alive",
] }

# NATS (Phase 3) — async client + JetStream (dùng rustls như phần còn lại của repo).
async-nats = { version = "0.38", default-features = false, features = ["ring"] }
# used to format NATS JetStream message timestamps while preserving the server's UTC offset
time = "0.3"
bytes = "1"

# Kafka (Phase 4) — rdkafka bọc librdkafka. Build từ source qua CMake (VS ships cmake).
# KHÔNG bật ssl (Windows thiếu nasm/perl để build OpenSSL) → PLAINTEXT + SASL/PLAIN;
# SASL_SSL/SCRAM là hạn chế đã ghi nhận. cmake-build + tokio runtime.
rdkafka = { version = "0.38", default-features = false, features = ["cmake-build", "tokio"] }

# Cassandra (Phase 4b) — scylla-rust-driver: async gốc, prepared statements,
# paging state, load-balancing policy. TLS qua rustls-023 (đồng bộ với repo,
# tránh openssl/nasm như rdkafka). chrono-04 để map timestamp/date sang JSON.
scylla = { version = "1.1", default-features = false, features = ["rustls-023", "chrono-04"] }
# rustls dùng ring (không aws-lc → khỏi cần C compiler) để dựng ClientConfig cho Cassandra TLS.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# async-trait: impl scylla AddressTranslator (dùng cho Cassandra qua NAT/tunnel/port-forward).
async-trait = "0.1"

# MongoDB (document store) — official async driver; default features use rustls
# (no OpenSSL/nasm), đồng bộ TLS toàn repo. bson đi kèm (re-export mongodb::bson).
mongodb = "3"

# Oracle — `oracle` crate (ODPI-C/OCI). Mature, returns full result sets. BLOCKING
# (driven via a per-connection actor thread) and needs Oracle Instant Client at
# runtime. Pivoted from the pure-Rust `oracle-rs` (0.1.7 truncated results at ~100
# rows + broke fetch_more — unusable). ODPI-C builds with the C compiler; OCI is
# dlopen'd at runtime.
oracle = "0.6"

# Misc
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
bigdecimal = "0.4"
regex = "1"
dirs = "5"

# OS keychain — native backend per platform (see NOTE by `aes-gcm` above).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Linux: persistent Secret Service (GNOME Keyring / KWallet) via D-Bus.
# `crypto-rust` keeps the session encryption pure-Rust (no OpenSSL system dep on CI).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
# Integration test: container tự bật/tắt cho từng hệ (không phụ thuộc DB cài sẵn)
testcontainers = "0.23"
# Kafka container (tự xử lý advertised.listeners) cho integration test Phase 4
testcontainers-modules = { version = "0.11", features = ["kafka"] }
# construct filter values (serde_json::json!) for grid-builder integration tests
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
