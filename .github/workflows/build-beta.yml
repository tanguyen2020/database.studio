name: Build beta (Windows / Ubuntu / macOS)

# Produces the beta installers for all three desktop platforms:
#   - Windows : NSIS  .exe        (windows-latest)
#   - Ubuntu  : .deb + .AppImage  (ubuntu-latest)
#   - macOS   : universal .dmg    (macos-latest, unsigned/ad-hoc)
#
# Trigger by hand from the Actions tab (Run workflow) or by pushing a tag like
# `v0.1.0-beta.2`. Installers are uploaded as build artifacts on each run.
#
# Pushing a tag ALSO publishes a GitHub Release carrying the signed updater
# artifacts and `latest.json`. That manifest is what the in-app updater reads
# (see tauri.conf.json → plugins.updater.endpoints), so an installed app can
# update itself instead of the user fetching an installer by hand.
# Requires ONE repo secret — without it the build fails, because the config asks
# for updater artifacts and they must be signed:
#   TAURI_SIGNING_PRIVATE_KEY   contents of the minisign private key file
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD is only needed if the key was generated WITH
# a password; ours has none, and an unset secret resolves to "" which is correct.
#
# macOS is UNSIGNED (no Apple Developer certificate) — testers open it past
# Gatekeeper with `xattr -cr "/Applications/Database Studio.app"` on first launch.
# The Oracle Instant Client is NOT bundled in this beta; Oracle connections fall
# back to a system-installed client (every other engine is unaffected).

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

# A newer run supersedes an in-flight one for the same ref.
concurrency:
  group: build-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_targets: ""
            args: ""
            artifact: database-studio-windows
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            rust_targets: ""
            args: ""
            artifact: database-studio-linux
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin --bundles app,dmg"
            artifact: database-studio-macos-universal
            paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz

    runs-on: ${{ matrix.os }}
    # tauri-action creates/updates the GitHub Release when a tag is pushed.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 Linux prerequisites (WebKitGTK 4.1 + GTK3 + tray + AppImage tools).
      # libcurl4-openssl-dev provides curl/curl.h: librdkafka 2.12.1's rdkafka_conf.c
      # includes it under a buggy `#ifdef WITH_OAUTHBEARER_OIDC` (config.h uses
      # #cmakedefine01, so the macro is always *defined* → the #include is always
      # compiled even though the curl-using code, gated by `#if WITH_CURL`==0, is
      # not). Only the header is needed; nothing links against libcurl.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libcurl4-openssl-dev \
            patchelf \
            build-essential \
            file

      - name: Install frontend dependencies
        run: npm ci

      # tauri-action runs the config's beforeBuildCommand (npm run build) then
      # `tauri build`. Windows/Ubuntu use the config's bundle targets; macOS
      # overrides them with a universal app+dmg via `args`.
      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          # Ad-hoc sign on macOS (no Apple Developer cert). "-" is required — an
          # EMPTY value makes codesign try identity "" and fail, and skipping it
          # leaves the arm64 slice unrunnable. Ignored on Windows/Linux.
          APPLE_SIGNING_IDENTITY: "-"
          # Signs the updater artifacts + latest.json. The app only installs an
          # update whose signature matches the pubkey baked into tauri.conf.json.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          # On a tag push: publish (or add to) the release for that tag and upload
          # the installers, the updater bundles and latest.json. On a manual run
          # tagName is empty, so tauri-action just builds and the step below keeps
          # uploading plain workflow artifacts as before.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Database Studio {0}', github.ref_name) || '' }}
          releaseBody: ${{ startsWith(github.ref, 'refs/tags/') && 'Installed copies of 0.1.0-beta.12 or newer offer this update in-app (Settings → Updates re-checks on demand). Earlier builds need a one-time manual install.' || '' }}
          releaseDraft: false
          # NOT marked as a pre-release on purpose: GitHub's `releases/latest`
          # skips pre-releases, so the updater endpoint
          # (releases/latest/download/latest.json) would 404 and no beta would
          # ever see an update. The beta status is carried by the version/tag name.
          prerelease: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.paths }}
