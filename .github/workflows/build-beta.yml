name: Build beta (Windows / Ubuntu / macOS)

# Produces the beta installers for all three desktop platforms:
#   - Windows : NSIS  .exe        (windows-latest)
#   - Ubuntu  : .deb + .AppImage  (ubuntu-latest)
#   - macOS   : universal .dmg    (macos-latest, unsigned/ad-hoc)
#
# Trigger by hand from the Actions tab (Run workflow) or by pushing a tag like
# `v0.1.0-beta.2`. Installers are uploaded as build artifacts on each run.
#
# macOS is UNSIGNED (no Apple Developer certificate) — testers open it past
# Gatekeeper with `xattr -cr "/Applications/Database Studio.app"` on first launch.
# The Oracle Instant Client is NOT bundled in this beta; Oracle connections fall
# back to a system-installed client (every other engine is unaffected).

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

# A newer run supersedes an in-flight one for the same ref.
concurrency:
  group: build-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_targets: ""
            args: ""
            artifact: database-studio-windows
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            rust_targets: ""
            args: ""
            artifact: database-studio-linux
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin --bundles app,dmg"
            artifact: database-studio-macos-universal
            paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 Linux prerequisites (WebKitGTK 4.1 + GTK3 + tray + AppImage tools).
      # libcurl4-openssl-dev provides curl/curl.h: librdkafka 2.12.1's rdkafka_conf.c
      # includes it under a buggy `#ifdef WITH_OAUTHBEARER_OIDC` (config.h uses
      # #cmakedefine01, so the macro is always *defined* → the #include is always
      # compiled even though the curl-using code, gated by `#if WITH_CURL`==0, is
      # not). Only the header is needed; nothing links against libcurl.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libcurl4-openssl-dev \
            patchelf \
            build-essential \
            file

      - name: Install frontend dependencies
        run: npm ci

      # tauri-action runs the config's beforeBuildCommand (npm run build) then
      # `tauri build`. Windows/Ubuntu use the config's bundle targets; macOS
      # overrides them with a universal app+dmg via `args`.
      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          # Ad-hoc sign on macOS (no Apple Developer cert). "-" is required — an
          # EMPTY value makes codesign try identity "" and fail, and skipping it
          # leaves the arm64 slice unrunnable. Ignored on Windows/Linux.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.paths }}
