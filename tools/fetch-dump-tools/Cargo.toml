[package]
name = "fetch-dump-tools"
version = "0.1.0"
edition = "2021"
publish = false
description = "Build-time fetcher: downloads, verifies and trims the backup client tools (pg_dump, mariadb-dump, mongodump, expdp) that Database Studio ships inside its installer."

# Stand-alone: not part of the app's crate graph.
[workspace]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
